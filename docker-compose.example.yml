services:
  lancache-dashboard:
    # Uses the published image by default (`docker compose up -d`, and
    # `docker compose pull` to update). To build from a local source checkout
    # instead, run `docker compose up -d --build` — the built image is tagged
    # with the name below.
    image: ghcr.io/imahmud1/lancache-dashboard:latest
    build: .
    container_name: lancache-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - LOG_PATH=/logs/access.log
      - DB_PATH=/app/data/lancache.db
      # IPs/prefixes hidden from stats by default (prefill from the cache host).
      - EXCLUDE_IPS=127.0.0.1,::1,172.,localhost
      # Extra prefill clients, added to EXCLUDE_IPS (e.g. a prefill workstation).
      - PREFILL_IPS=
      # Show client hostnames via reverse DNS (needs PTR records on your LAN DNS).
      - RESOLVE_HOSTNAMES=false
      # Match your lancache CACHE_MAX_AGE; used to estimate "likely cached".
      - CACHE_MAX_AGE_DAYS=60
      # Event branding (optional). Logo: put brand-logo.svg|png|webp|jpg in ./data.
      - BRAND_NAME=
      - BRAND_TAGLINE=
      - BRAND_ACCENT=
      # Access: pick ONE mode.
      # Public viewing + admin login (recommended for LAN events):
      - ADMIN_PASSWORD=
      # Private site: set BOTH to require a login for anyone to view anything.
      - DASHBOARD_USER=
      - DASHBOARD_PASSWORD=
    volumes:
      - /path/to/lancache/logs:/logs:ro
      - ./data:/app/data
